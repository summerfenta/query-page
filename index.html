<!DOCTYPE html>

    <title>资质证书查询</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
        }
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: normal;
            color: #1a1a1a;
        }
        .header .url {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        .card-title {
            text-align: center;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
            background: #f9f9f9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            word-break: break-all;
            vertical-align: top;
        }
        td:first-child {
            color: #666;
            width: 35%;
        }
        td:last-child {
            color: #111;
            width: 65%;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .highlight {
            color: #e4393c;
            font-weight: bold;
        }
    </style>
</head>
